<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IPAK Performance Assessment 2025</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#ebecf1; --bg2:#e2e5ec; --orb1:rgba(164,200,236,.55); --orb2:rgba(92,130,166,.28); --orb3:rgba(47,143,91,.14);
  --ink:#14283d; --ink2:#46607a; --ink3:#75899d;
  --navy:#183a5d; --navy2:#254f77; --blue:#5c82a6; --mist:#d3e1ea; --mist2:#dae4f0; --accent:#a4c8ec;
  --card:rgba(255,255,255,.66); --card-solid:#f3faff; --card-2:rgba(255,255,255,.42);
  --line:rgba(24,58,93,.13); --edge:rgba(255,255,255,.85);
  --shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 10px 30px -12px rgba(24,58,93,.28);
  --primary:#183a5d; --on-primary:#f3faff; --primary-hover:#254f77;
  --a:#1f7a4a; --a-bg:#d9f1e3; --b:#254f77; --b-bg:#d9e7f5; --c:#9a4a22; --c-bg:#fbe2d1; --na:#5b6b7b; --na-bg:#e3e8ee;
  --warn:#8a5a00; --warn-bg:#fff1cf; --bad:#a3262a; --bad-bg:#fde2e1;
  --curve:#1fa971; --curve2:#254f77;
  --nb-dark:#4f7f2e; --nb-dark-ink:#fff; --nb-mid:#a9d18e; --nb-blue:#adc4e6; --nb-warm:#f8cbad; --nb-ink:#14283d;
  --hero1:#183a5d; --hero2:#254f77;
  --font-d:"Outfit","Segoe UI",system-ui,sans-serif; --font-b:"Figtree","Segoe UI",system-ui,sans-serif;
  --r-lg:22px; --r-md:14px; --r-sm:9px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg1:#0d1827; --bg2:#122338; --orb1:rgba(92,130,166,.30); --orb2:rgba(37,79,119,.40); --orb3:rgba(47,143,91,.12);
    --ink:#e8eff7; --ink2:#a8bbcf; --ink3:#7f95ab;
    --card:rgba(26,48,74,.62); --card-solid:#16293f; --card-2:rgba(26,48,74,.4);
    --line:rgba(164,200,236,.16); --edge:rgba(164,200,236,.22);
    --shadow:0 1px 0 rgba(164,200,236,.12) inset, 0 12px 34px -14px rgba(0,0,0,.6);
    --primary:#a4c8ec; --on-primary:#0d1f33; --primary-hover:#c3dbf3;
    --a:#7fdcab; --a-bg:rgba(47,143,91,.26); --b:#a4c8ec; --b-bg:rgba(92,130,166,.30); --c:#f5b48f; --c-bg:rgba(200,110,60,.26); --na:#a8bbcf; --na-bg:rgba(164,200,236,.12);
    --warn:#ffd986; --warn-bg:rgba(255,200,80,.14); --bad:#ff9b98; --bad-bg:rgba(255,100,95,.16);
    --curve:#4fd49b; --curve2:#a4c8ec; --hero1:#0f2840; --hero2:#1b3f63;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg1:#0d1827; --bg2:#122338; --orb1:rgba(92,130,166,.30); --orb2:rgba(37,79,119,.40); --orb3:rgba(47,143,91,.12);
  --ink:#e8eff7; --ink2:#a8bbcf; --ink3:#7f95ab;
  --card:rgba(26,48,74,.62); --card-solid:#16293f; --card-2:rgba(26,48,74,.4);
  --line:rgba(164,200,236,.16); --edge:rgba(164,200,236,.22);
  --shadow:0 1px 0 rgba(164,200,236,.12) inset, 0 12px 34px -14px rgba(0,0,0,.6);
  --primary:#a4c8ec; --on-primary:#0d1f33; --primary-hover:#c3dbf3;
  --a:#7fdcab; --a-bg:rgba(47,143,91,.26); --b:#a4c8ec; --b-bg:rgba(92,130,166,.30); --c:#f5b48f; --c-bg:rgba(200,110,60,.26); --na:#a8bbcf; --na-bg:rgba(164,200,236,.12);
  --warn:#ffd986; --warn-bg:rgba(255,200,80,.14); --bad:#ff9b98; --bad-bg:rgba(255,100,95,.16);
  --curve:#4fd49b; --curve2:#a4c8ec; --hero1:#0f2840; --hero2:#1b3f63;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;color:var(--ink);font:15px/1.55 var(--font-b);font-variant-numeric:tabular-nums;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(520px 420px at 12% 8%,var(--orb1),transparent 70%),radial-gradient(620px 520px at 92% 18%,var(--orb2),transparent 72%),radial-gradient(520px 460px at 70% 96%,var(--orb3),transparent 70%)}
h1,h2,h3,h4{font-family:var(--font-d);margin:0;font-weight:600;letter-spacing:-.01em;line-height:1.2;color:var(--ink)}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* shell */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);gap:22px;max-width:1440px;margin:0 auto;padding:20px}
.side{position:sticky;top:calc(20px + env(safe-area-inset-top,0px));align-self:start;max-height:calc(100dvh - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;
  display:flex;flex-direction:column;gap:18px;padding:18px 14px;border-radius:var(--r-lg);background:var(--card);border:1px solid var(--edge);box-shadow:var(--shadow);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4)}
.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 0}
.brand svg{flex:none}
.brand b{display:block;font:600 22px/1 var(--font-d);letter-spacing:.04em}
.brand small{display:block;color:var(--ink2);font-size:12.5px;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border:0;border-radius:12px;background:transparent;color:var(--ink2);cursor:pointer;text-align:left;font-weight:500}
.nav button svg{flex:none;opacity:.85}
.nav button:hover{background:var(--card-2);color:var(--ink)}
.nav button[aria-current="page"]{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#f3faff;box-shadow:0 8px 18px -10px rgba(24,58,93,.7)}
:root[data-theme="dark"] .nav button[aria-current="page"]{background:linear-gradient(135deg,#2b5a86,#3b6d9c)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nav button[aria-current="page"]{background:linear-gradient(135deg,#2b5a86,#3b6d9c)}}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:14px;border-top:1px solid var(--line)}
.side-foot small{color:var(--ink3);font-size:12.5px;padding:0 6px 4px}
.link-btn{display:flex;align-items:center;gap:9px;padding:8px 10px;border:0;border-radius:10px;background:transparent;color:var(--ink2);cursor:pointer;font-size:13.5px;text-align:left}
.link-btn:hover{background:var(--card-2);color:var(--ink)}
.needs-dl{display:none!important}
.can-download .needs-dl{display:flex!important}
main{min-width:0;display:flex;flex-direction:column;gap:20px}

/* surfaces */
.glass{background:var(--card);border:1px solid var(--edge);border-radius:var(--r-lg);box-shadow:var(--shadow);backdrop-filter:blur(20px) saturate(1.35);-webkit-backdrop-filter:blur(20px) saturate(1.35)}
.pad{padding:24px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;padding:6px 4px 0}
.page-head h1{font-size:30px}
.page-head p{color:var(--ink2);margin-top:6px;max-width:62ch}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid transparent;background:var(--primary);color:var(--on-primary);font-weight:600;cursor:pointer;transition:background .15s}
.btn:hover{background:var(--primary-hover)}
.btn.ghost{background:var(--card-2);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--card)}
.btn.danger{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--ink2);cursor:pointer}
.icon-btn:hover{background:var(--card-2);color:var(--ink)}
.icon-btn.danger:hover{background:var(--bad-bg);color:var(--bad)}
.icon-btn[disabled]{opacity:.35;cursor:not-allowed}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip-a{background:var(--a-bg);color:var(--a)} .chip-b{background:var(--b-bg);color:var(--b)} .chip-c{background:var(--c-bg);color:var(--c)} .chip-na{background:var(--na-bg);color:var(--na)}
.chip.lg{padding:6px 14px;font-size:14.5px}

/* guidelines */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:42px 40px;color:#f3faff;background:linear-gradient(135deg,var(--hero1),var(--hero2));box-shadow:0 24px 50px -24px rgba(24,58,93,.7);display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:30px;align-items:end}
.hero::before{content:"";position:absolute;inset:-30% -10% auto auto;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(164,200,236,.38),transparent 68%)}
.hero::after{content:"";position:absolute;left:-60px;bottom:-110px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(79,212,155,.22),transparent 68%)}
.hero>*{position:relative;z-index:1}
.hero h1{color:#fff;font-size:clamp(34px,5vw,54px);line-height:1.04}
.hero .tag{font:300 clamp(20px,2.6vw,28px)/1.25 var(--font-d);color:#d7e6f6;margin-top:12px}
.hero .tag b{font-weight:600;color:#fff}
.hero-side{display:flex;flex-direction:column;gap:12px}
.period{padding:16px 18px;border-radius:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.period small{display:block;color:#bcd3ea;font-size:13px}
.period strong{display:block;font:600 19px/1.3 var(--font-d);margin-top:2px}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dates .period.end{background:rgba(255,255,255,.92);color:#8c1f23;border-color:transparent}
.dates .period.end small{color:#a24b4e}
.dates .period.end strong{color:#8c1f23}
.lead{font-size:17px;color:var(--ink2);max-width:78ch}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.card h2{font-size:21px;margin-bottom:6px}
.card .sub{color:var(--ink2);margin-bottom:14px}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.rules li{position:relative;padding-left:22px;color:var(--ink)}
.rules li::before{content:"";position:absolute;left:2px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--curve)}
.rules .note{display:block;color:var(--ink2);font-size:14px;margin-top:2px}
.scale{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.scale div{padding:11px 12px;border-radius:12px;background:var(--card-2);border:1px solid var(--line)}
.scale b{display:block;font:600 15px var(--font-d)}
.scale span{display:block;color:var(--ink2);font-size:13.5px}
.scale .sa{border-left:5px solid var(--a)} .scale .sb{border-left:5px solid var(--b)} .scale .sc{border-left:5px solid var(--c)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column}
.steps li{counter-increment:s;position:relative;padding:0 0 18px 48px}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:counter(s);position:absolute;left:0;top:-2px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#f3faff;font:600 14px var(--font-d)}
.steps li::after{content:"";position:absolute;left:15px;top:32px;bottom:2px;width:2px;background:var(--line)}
.steps li:last-child::after{display:none}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.seg{display:inline-flex;padding:4px;border-radius:12px;background:var(--card-2);border:1px solid var(--line);gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:9px;color:var(--ink2);cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.comp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:16px}
.comp{padding:18px;border-radius:var(--r-md);background:var(--card-2);border:1px solid var(--line)}
.comp h3{font-size:17px}
.comp .d{color:var(--ink2);font-size:14px;margin:4px 0 10px}
.comp details{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.comp summary{cursor:pointer;font-weight:600;font-size:14px;padding:4px 0}
.comp ul{margin:6px 0 0;padding-left:18px;font-size:14px;color:var(--ink2);display:flex;flex-direction:column;gap:4px}

/* nine box */
.nb{display:grid;grid-template-columns:auto auto repeat(3,minmax(0,1fr));gap:6px;align-items:stretch}
.nb .axis-y{grid-row:1/4;grid-column:1;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);font:600 13px var(--font-d);color:var(--ink2);padding:0 2px}
.nb .rl{display:flex;flex-direction:column;justify-content:center;align-items:center;font:600 15px var(--font-d);color:var(--ink);min-width:44px}
.nb .rl small,.nb .ct small{display:block;font:400 12px var(--font-b);color:var(--ink3)}
.nb .ct{text-align:center;font:600 15px var(--font-d);color:var(--ink)}
.nb .cell{position:relative;min-height:88px;padding:10px 8px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--nb-ink);border:2px solid transparent;transition:transform .15s,opacity .15s}
.nb .cell b{font:600 20px var(--font-d)}
.nb .cell span{font-size:12.5px;line-height:1.25;margin-top:2px}
.nb .dark{background:var(--nb-dark);color:var(--nb-dark-ink)} .nb .mid{background:var(--nb-mid)} .nb .blue{background:var(--nb-blue)} .nb .warm{background:var(--nb-warm)}
.nb.has-active .cell:not(.on){opacity:.42}
.nb .cell.on{transform:scale(1.04);border-color:var(--ink);box-shadow:0 10px 22px -10px rgba(0,0,0,.55);z-index:1}
.nb .cell .star{position:absolute;top:5px;right:9px;font-size:18px;line-height:1}
.nb .axis-x{grid-column:3/6;text-align:center;font:600 13px var(--font-d);color:var(--ink2);padding-top:2px}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{padding:20px}
.kpi small{color:var(--ink2);font-size:13.5px}
.kpi .v{font:600 34px/1.1 var(--font-d);margin:6px 0 2px;color:var(--ink)}
.kpi .s{color:var(--ink2);font-size:13.5px}
.mix{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--na-bg);margin:12px 0 8px}
.mix i{display:block;height:100%}
.mix .ma{background:var(--a)} .mix .mb{background:var(--blue)} .mix .mc{background:#d9824f}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--blue)}
.legend .la::before{background:var(--a)} .legend .lc::before{background:#d9824f}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.chart-card h2{font-size:20px}
.chart-card .sub{color:var(--ink2);font-size:14px;margin:4px 0 8px}
.chart-card svg{width:100%;height:auto;display:block}
.curve-in{stroke-dasharray:1;stroke-dashoffset:0}
@media (prefers-reduced-motion:no-preference){.curve-in{animation:draw 1.3s ease-out both}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.buckets{display:flex;flex-direction:column;gap:16px}
.bk-row{display:grid;grid-template-columns:170px minmax(0,1fr) 150px;gap:14px;align-items:center}
.bk-row b{font-family:var(--font-d)}
.bk-row small{display:block;color:var(--ink2)}
.bar{position:relative;height:16px;border-radius:99px;background:var(--na-bg);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--navy2),var(--blue))}
.bar em{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--curve);border-radius:2px}
.gap{font-weight:600;text-align:right}
.tbl-wrap{overflow-x:auto;border-radius:var(--r-md);border:1px solid var(--line);background:var(--card-2)}
table{border-collapse:collapse;width:100%}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 13.5px var(--font-d);color:var(--ink2);background:var(--card-2);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
.num{text-align:right;white-space:nowrap}
.names{display:flex;flex-wrap:wrap;gap:6px}
.name-chip{border:1px solid var(--line);background:var(--card-2);border-radius:99px;padding:2px 10px;font-size:13px;cursor:pointer;color:var(--ink)}
.name-chip:hover{background:var(--card)}
.code{display:inline-grid;place-items:center;min-width:42px;padding:2px 8px;border-radius:8px;font:600 14px var(--font-d)}
.code.dark{background:var(--nb-dark);color:#fff} .code.mid{background:var(--nb-mid);color:var(--nb-ink)} .code.blue{background:var(--nb-blue);color:var(--nb-ink)} .code.warm{background:var(--nb-warm);color:var(--nb-ink)}

/* employees */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.search{position:relative;flex:1 1 260px;max-width:420px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.search input{width:100%;padding:11px 14px 11px 40px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline-offset:2px}
.emp-table{min-width:980px}
.emp-table tbody tr{cursor:pointer}
.emp-table tbody tr:hover td{background:var(--card)}
.emp-table .sticky{position:sticky;left:0;background:var(--card-solid);z-index:1}
.emp-table td .nm{font-weight:600}
.emp-table td .ds{display:block;color:var(--ink2);font-size:13px}
.org{display:none}
.show-org .org{display:table-cell}
.toggle{display:inline-flex;align-items:center;gap:8px;color:var(--ink2);font-size:14px;cursor:pointer}
.empty{padding:34px;text-align:center;color:var(--ink2)}

/* form */
.picker{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.picker select,.field select,.field input,.field textarea,.cell-in{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px;width:100%;outline-offset:2px}
.picker select{width:auto;min-width:260px;font-weight:600}
.paper{padding:0;overflow:hidden}
.paper-head{padding:30px 32px 26px;background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px}
.paper-head h1{color:#fff;font-size:26px}
.paper-head p{color:#cfe0f2;font-size:14px;margin-top:4px}
.paper-head .final{display:flex;align-items:center;gap:12px;padding:10px 16px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:16px}
.paper-head .final b{font:600 28px var(--font-d)}
.paper-head .final small{display:block;color:#cfe0f2;font-size:13px}
.sec{padding:26px 32px;border-top:1px solid var(--line)}
.sec>h2{font-size:20px;margin-bottom:4px}
.sec>.sub{color:var(--ink2);margin-bottom:16px;font-size:14.5px}
.info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 28px}
.info .row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.info .row span:first-child{color:var(--ink2);font-size:14px}
.info .row strong{font-weight:600;word-break:break-word}
.ipi{min-width:1040px}
.ipi th.grp{text-align:center;border-bottom:1px solid var(--line)}
.ipi td{vertical-align:middle}
.cell-in{padding:7px 9px;font-size:14px;resize:none;overflow:hidden;line-height:1.4;min-height:38px;display:block}

.ipi tfoot .lab{text-align:right;color:var(--ink2)}
.msgs{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.msg{display:flex;gap:9px;align-items:flex-start;padding:9px 12px;border-radius:11px;font-size:14px;background:var(--warn-bg);color:var(--warn)}
.msg.ok{background:var(--a-bg);color:var(--a)}
.msg.bad{background:var(--bad-bg);color:var(--bad)}
.msg svg{flex:none;margin-top:2px}
.sec-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.bpi td{vertical-align:top}
.bpi .cn{min-width:210px}
.bpi .cn b{font:600 16px var(--font-d);display:block}
.bpi .cn span{color:var(--ink2);font-size:13.5px;display:block;margin-top:4px}
.bpi ul{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:5px;font-size:13.5px;color:var(--ink2)}
.bpi .ind{min-width:260px}
.bpi .rt{min-width:190px}
.bpi .rt select{margin-bottom:8px}
.bpi .sc{color:var(--ink2);font-size:13.5px}
.bpi tfoot td{background:var(--card-2);font-weight:600;border-bottom:0}
.final-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:30px;align-items:center}
.final-lines{display:flex;flex-direction:column;gap:14px}
.final-lines .ln{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line)}
.final-lines .ln span:first-child{color:var(--ink2)}
.big-code{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:var(--card-2);border:1px solid var(--line)}

.sign{margin-top:12px;height:58px;border-bottom:1.5px solid var(--ink3);position:relative}

.sign-spc{height:22px}

dialog::backdrop{background:rgba(10,24,40,.5);backdrop-filter:blur(3px)}
dialog form{display:flex;flex-direction:column;max-height:calc(100dvh - 40px)}
dialog header{padding:22px 24px 6px}
dialog header h2{font-size:21px}
dialog .body{padding:10px 24px 8px;overflow:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
dialog .body.one{grid-template-columns:1fr}
dialog footer{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px 22px}
.field label{display:block;font-size:13.5px;color:var(--ink2);margin-bottom:5px}
.field.span{grid-column:1/-1}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--primary);color:var(--on-primary);padding:11px 18px;border-radius:12px;font-weight:600;transition:.25s;z-index:50;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

}
.mob-menu{display:none;gap:8px;flex-wrap:wrap}

/* ---------- PMS calculation logic (mirrors the Excel formulas) ---------- */
const LEVEL = { A: "A - Exceed Expectation", B: "B - Meet Expectation", C: "C - Below Expectation" };
const BPI_OPTIONS = ["Select Rating", "Developed Behaviour", "Need Improvement"];
const BPI_STEP = 1667; // 16.67% per competency, kept in basis points to avoid float drift
const NINE_BOX = {
  "A A": "Exceptional Performer", "A B": "High Performer", "A C": "Potential Resource",
  "B A": "High Performer", "B B": "Good Performer", "B C": "Contributor",
  "C A": "Concern", "C B": "Low Performer", "C C": "Low Performer"
};
const CURVE_ORDER = ["C C", "C B", "C A", "B C", "B B", "A C", "B A", "A B", "A A"];
const IDEAL = { "C C": 5, "C B": 5, "C A": 5, "B C": 10, "B B": 50, "A C": 10, "B A": 5, "A B": 5, "A A": 5 };
const BUCKETS = [
  { key: "low", label: "Needs attention", cats: ["C C", "C B", "C A"], ideal: 15 },
  { key: "core", label: "Core performers", cats: ["B C", "B B", "A C"], ideal: 70 },
  { key: "high", label: "Top performers", cats: ["B A", "A B", "A A"], ideal: 15 }
];
const r9 = (x) => Math.round(x * 1e9) / 1e9;

/* Excel: IF(K>=98%,"A",IF(K>=80%,"B",IF(K>=0.01%,"C",IF(K=0%,"Add Achievement %")))) */
function achievementLevel(k) {
  k = r9(Number(k) || 0);
  if (k >= 0.98) return LEVEL.A;
  if (k >= 0.8) return LEVEL.B;
  if (k >= 0.0001) return LEVEL.C;
  return "Add Achievement %";
}
/* Excel: N = I * K */
function weighted(w, k) { return r9((Number(w) || 0) * (Number(k) || 0)); }
function weightTotal(objs) { return r9(objs.reduce((s, o) => s + (Number(o.w) || 0), 0)); }
function ipiScore(objs) { return r9(objs.reduce((s, o) => s + weighted(o.w, o.pct), 0)); }
/* Excel: IF(N14>=98,A,IF(N14>=80,B,C)) */
function ipiRating(score) {
  score = r9(score);
  if (score >= 98) return LEVEL.A;
  if (score >= 80) return LEVEL.B;
  return LEVEL.C;
}
/* Excel: Q = 16.67% per "Developed Behaviour", 0 otherwise */
function bpiBps(bpi) { return bpi.filter((x) => x === "Developed Behaviour").length * BPI_STEP; }
function bpiScore(bpi) { return bpiBps(bpi) / 10000; }
/* Excel: IF(Q25>=100%,A,IF(Q25>=66.68%,B,C)) */
function bpiRating(bpi) {
  const b = bpiBps(bpi);
  if (b >= 10000) return LEVEL.A;
  if (b >= 6668) return LEVEL.B;
  return LEVEL.C;
}
const shortOf = (label) => (label === LEVEL.A ? "A" : label === LEVEL.B ? "B" : label === LEVEL.C ? "C" : "N/A");
/* IFL: CONCATENATE(Short IPI," ",Short BPI) */
function finalCode(ipiR, bpiR) { return shortOf(ipiR) + " " + shortOf(bpiR); }
function compSetFor(grade) { return /^MM/i.test(String(grade || "").trim()) ? "mgr" : "all"; }

function evaluate(form) {
  const objs = form.objs || [];
  const ipi = ipiScore(objs), ipiR = ipiRating(ipi);
  const bpiS = bpiScore(form.bpi), bpiR = bpiRating(form.bpi);
  return { ipi, ipiR, bpi: bpiS, bpiR, code: finalCode(ipiR, bpiR), label: NINE_BOX[finalCode(ipiR, bpiR)] || "" };
}
function distribution(results) {
  const counts = {}; CURVE_ORDER.forEach((c) => (counts[c] = 0));
  results.forEach((r) => { if (counts[r.code] !== undefined) counts[r.code]++; });
  const total = results.length;
  const pct = {}; CURVE_ORDER.forEach((c) => (pct[c] = total ? (counts[c] / total) * 100 : 0));
  return { counts, pct, total };
}
if (false) module.exports = { LEVEL, achievementLevel, weighted, weightTotal, ipiScore, ipiRating, bpiScore, bpiRating, evaluate, distribution, compSetFor, finalCode, CURVE_ORDER, IDEAL, BUCKETS };

ING & DEVELOPMENT","desc":"Ability to develop self and others in the creation of a diverse & high-performing culture","dev":"• Leverages performance, development, and key behaviors to build people capabilities.\n• Helps team members to identify and understand their own blind spots that prevent them from working more effectively.\n• Coaches others (listens, questions, challenges) to let them explore the solutions independently.\n• Aligns development expectations and actively supports personal & professional development.\n• Builds diverse teams for long-term sustainability.","need":"• Does not adequately recognize desired behaviors.\n• Tends to provide solutions or answers rather than giving the opportunity for learning.\n• Avoids the conversations required to align career and development opportunities of self & team.\n• Lacks active listening which affects the team’s motivation and performance.\n• Discourages the team for learning & development opportunities."},{"name":"OWNERSIP","desc":"Ability to take responsibility for one’s work, decisions, and actions","dev":"• Promotes a culture, where people can be their authentic selves to take ownership of what they do.\n• Takes ownership of the team’s actions instead of blaming team members.\n• Adapts effectively to different situations even under stress or pressure to achieve the Company’s Objectives.\n• Addresses difficult issues in a timely manner where possible without putting the onus on someone.\n• Is clear in his thoughts and proposes solutions to problems effectively.","need":"• Lacks the ability to track progress and intervene when necessary.\n• Fails to own a well-developed point of view to achieve the Company’s Objectives.\n• Dismisses alternative ideas and discourages colleagues from suggesting new ways of doing things.\n• Fails to take ownership of personal or team performance.\n• Fails to effectively communicate the Company’s strategy to others"},{"name":"HUMILITY","desc":"Ability to be humble in a demonstrable way and lead with an example of always doing the right thing","dev":"• Recognizes quality contributions of all team members & cross-functional team members\n• Listens actively to the team’s point of view instead of using authority.\n• Gives direct actionable feedback about performance and behaviour by treating others professionally\n• Keeps confidentiality intact of other’s personal issues and doesn’t share publicly.\n• Takes the criticism of someone positively, keeping the authority aside","need":"• Fails to act as a team member because of the authorities.\n• Finds shortcuts when under pressure instead of following the defined protocols.\n• Presents him/herself in a way that is inconsistent with the vision of the Company.\n• Makes false promises to avoid transparent discussion.\n• Puts him/herself before the Company"},{"name":"INTEGRITY","desc":"Ability to commit ethical conduct and moral principles in all activities","dev":"• Leads by example and set clear expectations for ethical behaviour in their teams.\n• Provides honest, constructive, and timely feedback to one’s team members.\n• Makes fair and objective decisions based on evidence and best practices.\n• Communicates openly and effectively with all stakeholders about the Objectives, progress, and challenges of their work.\n• Recognizes team members who demonstrate integrity and address those who do not.","need":"• Fails to follow through on one’s commitments or promises or lets others off the hook for theirs.\n• Rationalizes own mistakes or failures and discourages others from addressing theirs.\n• Lacks in addressing ethical violations within their teams.\n• Exhibits insensitive behaviour in identifying and addressing conflicts of interest.\n• Lacks in developing the biasness free work environment."},{"name":"INNOVATION","desc":"The ability to generate novel ideas, solutions, approaches, and to think outside the box to add value to tasks, projects, and the organization as a whole.","dev":"• Provides the fr eniors to improve the results.\n• Shows a positive attitude when someone provides improvement feedback on his/her work.","need":"• Avoids sharing knowledge with others for their coaching and development.\n• Doesn’t listen actively for better understanding and tends to respond without clarity.\n• Lacks the confidence to challenge the status quo where improvement is possible.\n• Fails to gain the trust and support of others.\n• Fails to accept or adjust oneself to new responsibilities."},{"name":"OWNERSIP","desc":"Ability to take responsibility for one’s work, decisions, and actions","dev":"• Accepts responsibility and owns the results without putting weight on others.\n• Considers the Company’s priorities when making decisions and analyzing various alternative solutions.\n• Takes ownership to solve problems and inform others about potential issues.\n• Is able to prioritize between “Urgent” & “Important” to achieve the Company’s objectives.\n• Takes ownership of self development in both; skills and behaviors.","need":"• Fails to accept challenges and opportunities.\n• Blames the system or others.\n• Fails to propose solutions to problems effectively.\n• Dismisses the importance of his/her responsibilities & contributions\n• Fails to ensure standards in completing the assigned tasks."},{"name":"HUMILITY","desc":"Ability to be humble in a demonstrable way and lead with an example of always doing the right thing","dev":"• Offers unconditional support to peers to achieve the Company’s objectives.\n• Actively listen to other’s points of view with an open mind and heart instead of putting oneself on priority.\n• Respects others professionally without any prejudice regardless of their position in the Company\n• Is easily approachable to help & support professionally.\n• Is humble and seen as a Respectable professional\n• Treat others with courtesy, dignity, and empathy.","need":"• Displays negative behavior towards others and the Company.\n• Has a tendency to abuse authoriti function nineBox(active) {
  const rows = [["A", "Exceed"], ["B", "Meet"], ["C", "Below"]], cols = [["C", "Below"], ["B", "Meet"], ["A", "Exceed"]];
  let h = `<div class="nb${active ? " has-active" : ""}" role="group" aria-label="Nine box performance model"><div class="axis-y">Individual performance (IPI)</div>`;
  rows.forEach(([r, rn]) => {
    h += `<div class="rl">${r}<small>${rn}</small></div>`;
    cols.forEach(([c]) => {
      const code = r + " " + c, on = active === code;
      h += `<div class="cell ${boxCls[code]}${on ? " on" : ""}"${on ? ' aria-current="true"' : ""}>${on ? '<i class="star" aria-hidden="true">★</i>' : ""}<b>${r}${c}</b><span>${NINE_BOX[code]}</span></div>`;
    });
  });
  h += `<i></i><i></i>` + cols.map(([c, n]) => `<div class="ct">${c}<small>${n}</small></div>`).join("");
  h += `<i></i><i></i><div class="axis-x">Behaviour performance (BPI)</div></div>`;
  return h;
}

function monotone(pts) {
  const n = pts.length, dx = [], m = [], t = [];
  for (let i = 0; i < n - 1; i++) { dx[i] = pts[i + 1][0] - pts[i][0]; m[i] = (pts[i + 1][1] - pts[i][1]) / dx[i]; }
  t[0] = m[0]; t[n - 1] = m[n - 2];
  for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
  for (let i = 0; i < n - 1; i++) { if (m[i] === 0) { t[i] = 0; t[i + 1] = 0; continue; } const a = t[i] / m[i], b = t[i + 1] / m[i], s = a * a + b * b; if (s > 9) { const k = 3 / Math.sqrt(s); t[i] = k * a * m[i]; t[i + 1] = k * b * m[i]; } }
  let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < n - 1; i++) { const h = dx[i] / 3; d += ` C${(pts[i][0] + h).toFixed(1)} ${(pts[i][1] + t[i] * h).toFixed(1)} ${(pts[i + 1][0] - h).toFixed(1)} ${(pts[i + 1][1] - t[i + 1] * h).toFixed(1)} ${pts[i + 1][0].toFixed(1)} ${pts[i + 1][1].toFixed(1)}`; }
  return d;
}

  const cnt = (key, L2) => res.filter((r) => r[key] === L2).length;
  const mixHTML = (key) => { const a = cnt(key, LEVEL.A), b = cnt(key, LEVEL.B), c = cnt(key, LEVEL.C); const p = (x) => (n ? (x / n) * 100 : 0).toFixed(1);
    return `<div class="mix" role="img" aria-label="A ${a}, B ${b}, C ${c}"><i class="ma" style="width:${p(a)}%"></i><i class="mb" style="width:${p(b)}%"></i><i class="mc" style="width:${p(c)}%"></i></div><div class="legend"><span class="la">A ${a}</span><span>B ${b}</span><span class="lc">C ${c}</span></div>`; };
  const avgI = n ? res.reduce((s, r) => s + r.ipi, 0) / n : 0, avgB = n ? (res.reduce((s, r) => s + r.bpi, 0) / n) * 100 : 0;
  const bucketCount = (b) => b.cats.reduce((s, c) => s + d.counts[c], 0);
  const bucketPct = (b) => (n ? (bucketCount(b) / n) * 100 : 0);
  const top = BUCKETS[2];
  const sections = new Set(S.emps.map((e) => e.section)).size;
  const chartA = curveSVG(d.pct, { color: "var(--curve2)", ref: true, dots: true, draw: true, counts: d.counts, aria: "Actual performance curve against the ideal curve", bucket: (b) => fmtN(bucketPct(b), 1) + "%" });
  const chartI = curveSVG(IDEAL, { color: "var(--curve)", aria: "Ideal performance curve: 15 percent, 70 percent, 15 percent", bucket: (b) => b.ideal + "%" });
  const bk = BUCKETS.map((b) => { const a = bucketPct(b), g = a - b.ideal; return `<div class="bk-row"><div><b>${b.label}</b><small>${b.cats.map((c) => c.replace(" ", "")).join(", ")}</small></div><div class="bar" role="img" aria-label="${b.label}: actual ${fmtN(a, 1)}%, ideal ${b.ideal}%"><i style="width:${Math.min(a, 100)}%"></i><em style="left:calc(${b.ideal}% - 1px)"></em></div><div class="gap">${fmtN(a, 1)}% <small style="display:inline;color:var(--ink2);font-weight:400">vs ${b.ideal}% ideal (${g >= 0 ? "+" : "−"}${fmtN(Math.abs(g), 1)} pts)</small></div></div>`; }).join("");
  const rows = CURVE_ORDER.map((c) => { const g = d.pct[c] - IDEAL[c]; const who = res.filter((r) => r.code === c); return `<tr><td>${codeTag(c)} <span style="margin-left:6px">${NINE_BOX[c]}</span></td><td class="num">${IDEAL[c]}%</td><td class="num">${fmtN(d.pct[c], 1)}%</td><td class="num">${d.counts[c]}</td><td class="num">${g >= 0 ? "+" : "−"}${fmtN(Math.abs(g), 1)}</td><td><div class="names">${who.map((r) => `<button class="name-chip" data-act="open" data-id="${r.e.id}">${esc(r.e.name)}</button>`).join("") || '<span style="color:var(--ink3)">–</span>'}</div></td></tr>`; }).join("");
  return `
  <div class="page-head"><div><h1>Dashboard</h1><p>How the team’s final ratings compare with the ideal distribution. Everything here recalculates as forms change.</p></div></div>
  <div class="kpis">
    <div class="glass kpi"><small>Employees assessed</small><div class="v">${n}</div><div class="s">${sections} ${sections === 1 ? "section" : "sections"} in the register</div></div>
    <div class="glass kpi"><small>IPI ratings · average ${fmtN(avgI, 1)}</small>${mixHTML("ipiR")}</div>
    <div class="glass kpi"><small>BPI ratings · average ${fmtN(avgB, 1)}%</small>${mixHTML("bpiR")}</div>
    <div class="glass kpi"><small>Top performers (BA, AB, AA)</small><div class="v">${bucketCount(top)} <span style="font-size:17px;font-weight:400;color:var(--ink2)">of ${n}</span></div><div class="s">${fmtN(bucketPct(top), 1)}% against an ideal ${top.ideal}%</div></div>
  </div>
  <div class="charts">
    <section class="glass pad chart-card"><h2>Ideal performance curve</h2><p class="sub">The target spread across the nine final-rating boxes.</p>${chartI}</section>
    <section class="glass pad chart-card"><h2>Actual performance curve</h2><p class="sub">Your team’s spread. The dashed line is the ideal curve.</p>${chartA}</section>
  </div>
  <section class="glass pad card"><h2>Distribution against the 15 / 70 / 15 target</h2><p class="sub">The marker on each bar is the ideal share.</p><div class="buckets">${bk}</div></section>
  <section class="glass pad card"><h2>Breakdown by final rating</h2><p class="sub">Select a name to open that employee’s form.</p>
    <div class="tbl-wrap"><table><thead><tr><th>Final rating</th><th class="num">Ideal</th><th class="num">Actual</th><th class="num">Headcount</th><th class="num">Gap (pts)</th><th>Employees</th></tr></thead><tbody>${rows}</tbody></table></div></section>${moreActions()}`;
}

function curForm() { return formOf(ui.id); }
function refreshForm() {
  const f = curForm(), ev = evaluate(f);

  $("#ipiTotal").textContent = fmtN(ev.ipi) + " / 100"; $("#ipiRating").innerHTML = chip(ev.ipiR, ev.ipiR, true);
  const msgs = []; const n = f.objs.length;
  if (n < 4) msgs.push(["", `Add at least 4 smart objectives (you have ${n}).`]);
  if (wt !== 100) msgs.push(["", `Weightage totals ${fmtN(wt)}. It must total 100.`]);

  $("#bpiTotal").textContent = fmtN(ev.bpi * 100) + "%"; $("#bpiRating").innerHTML = chip(ev.bpiR, ev.bpiR, true);

}

  const fld = (k, l, t = "text", extra = "") => `<div class="field"><label for="e_${k}">${l}</label><input id="e_${k}" name="${k}" type="${t}" value="${esc(k === "perf24" ? (typeof e.perf24 === "number" ? fmtN(e.perf24 * 100) : "") : e[k])}" ${extra}></div>`;
  const d = dlg(); d.onclose = null;
  d.innerHTML = `<form method="dialog" id="empForm" novalidate autocomplete="off"><header><h2>${id == null ? "Add employee" : "Edit employee"}</h2></header><div class="body">
    ${fld("id", "Employee ID", "number", id == null ? 'min="1"' : "readonly")}${fld("name", "Full name")}${fld("desig", "Designation")}${fld("grade", "Grade")}${fld("loc", "Location")}${fld("geo", "Geo")}${fld("dept", "Department")}${fld("section", "Section (sub department)")}${fld("doj", "Date of joining", "date")}${fld("perf24", "2024 performance (%, blank if none)", "number", 'min="0" max="100" step="0.01"')}${fld("sup", "Direct supervisor")}${fld("hod", "Head of department")}
    <div class="field span" id="empErr"></div></div><footer><button type="button" class="btn ghost" data-act="close-dlg">Cancel</button><button type="submit" class="btn" id="empSave">Save employee</button></footer></form>`;
  $("#empForm").addEventListener("submit", (ev) => {
    ev.preventDefault(); const g = (k) => $("#e_" + k).value.trim(); const err = (t) => { $("#empErr").innerHTML = `<div class="msg bad">${ico("alert", 16)}<span>${esc(t)}</span></div>`; };
    const nid = Number(g("id")); if (!Number.isInteger(nid) || nid <= 0) return err("Enter a whole-number Employee ID.");
    if (id == null && empOf(nid)) return err("That Employee ID is already in the register.");
    if (!g("name")) return err("Enter the employee’s full name.");
    const p = g("perf24"); const rec = { id: nid, name: g("name"), desig: g("desig"), loc: g("loc"), geo: g("geo"), dept: g("dept"), section: g("section"), grade: g("grade"), doj: g("doj"), sup: g("sup"), hod: g("hod"), perf24: p === "" ? null : Math.max(0, Math.min(100, Number(p))) / 100 };
    if (id == null) { S.emps.push(rec); S.forms[nid] = blankForm(); } else { S.emps[S.emps.findIndex((x) => x.id === id)] = rec; }
    save(); d.close(); render(); toast(id == null ? "Employee added" : "Employee updated");
  });
  d.showModal();
}

/* ----- events ----- */
document.addEventListener("click", async (ev) => {
  const t = ev.target.closest("[data-act]"); if (!t) { return; }
  const act = t.dataset.act, id = t.dataset.id != null ? Number(t.dataset.id) : null;
  if (act === "open-row") { if (ev.target.closest("button")) return; return go("form", id); }
  if (act === "open") return go("form", id);
  if (act === "set-comp") { ui.set = t.dataset.v; $("#compGrid").innerHTML = compGrid(ui.set); $$("[data-act='set-comp']").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === ui.set))); return; }
  if (act === "close-dlg") { dlg().close(); return; }
  if (act === "add-emp") return openEmp(null);
  if (act === "edit-emp") return openEmp(id);
  if (act === "del-emp") { const e = empOf(id); if (await confirmBox("Remove employee?", `${e.name} and their assessment form will be removed from this browser’s data.`, "Remove", true)) { S.emps = S.emps.filter((x) => x.id !== id); delete S.forms[id]; save(); render(); toast("Employee removed"); } return; }
  if (act === "prev" || act === "next") { const i = S.emps.findIndex((x) => x.id === ui.id) + (act === "next" ? 1 : -1); if (S.emps[i]) { ui.id = S.emps[i].id; render(); window.scrollTo(0, 0); } return; }
  if (act === "add-obj") { const f = curForm(); if (f.objs.length < 7) { f.objs.push(blankObj()); save(); keepScroll(render); } return; }
  if (act === "del-obj") { const f = curForm(); f.objs.splice(Number(t.dataset.i), 1); save(); keepScroll(render); return; }
  if (act === "print") { try { window.print(); } catch (e) { toast("Use your browser’s print shortcut"); } return; }
  if (act === "theme") { const n = curTheme() === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = n; try { localStorage.setItem(THEME_KEY, n); } catch (e) {} return keepScroll(render); }
  if (act === "export-csv") return exportCSV();
  if (act === "export-json") return saveFile("ipak-pms-2025-backup.json", JSON.stringify(S, null, 1));
  if (act === "import") return $("#file").click();
  if (act === "reset") { if (await confirmBox("Restore original data?", "This replaces everything in this browser with the data from the Excel workbook. Changes you made will be lost.", "Restore", true)) { S = seed(); save(); render(); toast("Original data restored"); } return; }
});
$(".nav").addEventListener("click", (ev) => { const b = ev.target.closest("button[data-v]"); if (b) go(b.dataset.v); });
document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.id === "q") { ui.q = t.value; return refreshEmpTable(); }
  if (!t.dataset || !t.dataset.f || ui.view !== "form") return;
  const f = curForm(), k = t.dataset.f, i = Number(t.dataset.i);
  if (["obj", "A", "B", "C", "ach"].includes(k)) f.objs[i][k] = t.value;
  else if (k === "w") f.objs[i].w = parseFloat(t.value) || 0;
  else if (k === "pct") { const v = parseFloat(t.value); f.objs[i].pct = isNaN(v) ? 0 : Math.max(0, Math.min(100, v)) / 100; }
  else if (["lm", "hod", "emp"].includes(k)) f[k] = t.value;
  else return;
  if (t.tagName === "TEXTAREA" && t.classList.contains("auto")) autoGrow(t);
  save(); refreshForm();
});
document.addEventListener("change", (ev) => {
  const t = ev.target;
  if (t.id === "orgT") { ui.org = t.checked; $("#empWrap").classList.toggle("show-org", ui.org); return; }
  if (t.id === "pick") { ui.id = Number(t.value); render(); return; }
  if (t.id === "file") { importFile(t.files[0]); t.value = ""; return; }
  if (ui.view !== "form" || !t.dataset.f) return;
  const f = curForm();
  if (t.dataset.f === "bpi") { f.bpi[Number(t.dataset.i)] = t.value; save(); refreshForm(); }
  if (t.dataset.f === "set") { f.set = t.value; save(); keepScroll(render); }
});
function importFile(file) {
  if (!file) return; const r = new FileReader();
  r.onload = () => { try { const s = JSON.parse(r.result); if (!valid(s)) throw 0; S = s; save(); render(); toast("Backup imported"); } catch (e) { toast("That file is not a PMS backup"); } };
  r.readAsText(file);
}
try { const t = localStorage.getItem(THEME_KEY); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (e) {}
render();
})();

</script>
</body>
