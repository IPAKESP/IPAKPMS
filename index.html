<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPAK PMS 2025 – Performance Assessment</title>
<style>:root{
  --g1:#1f5b3a;--g2:#2f8f5b;--g3:#34b27b;--g4:#e6f4ec;
  --bg:#f4f6f5;--card:#fff;--ink:#1d2a24;--mute:#66756d;--line:#dbe3de;
  --A:#548235;--B:#a9d18e;--C:#f8cbad;--blue:#aec6e8;
  --warn:#b45309;--err:#b42318;--ok:#067647;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){--bg:#101613;--card:#18211c;--ink:#e8efe9;--mute:#9bb0a3;--line:#2a3830;--g4:#1c2b23}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--g2)}
.top{background:linear-gradient(90deg,var(--g1),var(--g2));color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px #0002}
.top-in{max-width:1280px;margin:auto;display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:.5px;font-size:17px}
.brand small{display:block;font-weight:400;font-size:11px;opacity:.85;letter-spacing:0}
nav{display:flex;gap:2px;flex-wrap:wrap;flex:1}
nav a{color:#fff;text-decoration:none;padding:7px 12px;border-radius:8px;opacity:.88}
nav a:hover{background:#ffffff22}
nav a.on{background:#ffffff33;opacity:1;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;background:#ffffff26;border-radius:99px;padding:4px 11px;font-size:12px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#9aa;display:inline-block}
.dot.ok{background:#4ade80}.dot.warn{background:#fbbf24}.dot.err{background:#f87171}
main{max-width:1280px;margin:18px auto;padding:0 16px 60px}
h1{font-size:22px;margin:4px 0 14px}h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi b{display:block;font-size:26px;line-height:1.1}.kpi span{color:var(--mute);font-size:12px}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 13px;border-radius:9px;cursor:pointer}
.btn:hover{border-color:var(--g2)}
.btn.p{background:var(--g2);border-color:var(--g2);color:#fff}.btn.p:hover{background:var(--g1)}
.btn.d{background:var(--err);border-color:var(--err);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 9px;font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
input,select,textarea{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 9px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g3);outline-offset:-1px}
input[readonly],textarea[readonly],input:disabled,select:disabled,textarea:disabled{background:transparent;border-color:transparent;color:var(--ink);-webkit-text-fill-color:var(--ink);opacity:1}
textarea{resize:vertical;min-height:60px}
label.f{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--mute);font-weight:600;background:var(--g4);position:sticky;top:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--g4)}
.tw{overflow-x:auto;max-height:70vh}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.lA{background:#dcefd0;color:#2d5016}.lB{background:#e0ecf9;color:#1e3a5f}.lC{background:#fde2cf;color:#8a3b0b}.l0{background:#eee;color:#666}
.s-draft{background:#eee;color:#555}.s-lm{background:#fff3cd;color:#7a5b00}.s-hod{background:#dbeafe;color:#1e40af}.s-final{background:#d1fae5;color:#065f46}
.nine{display:grid;grid-template-columns:34px repeat(3,1fr);gap:6px;max-width:560px}
.nine .ax{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mute);writing-mode:vertical-rl;transform:rotate(180deg)}
.nine .axh{text-align:center;font-size:11px;color:var(--mute)}
.box{border-radius:10px;padding:8px;min-height:92px;color:#111;cursor:pointer;position:relative;border:2px solid transparent}
.box:hover{border-color:var(--g1)}
.box b{font-size:16px}.box small{display:block;font-size:11px;opacity:.85}
.box .n{font-size:24px;font-weight:800;margin-top:2px}
.box.dk{color:#fff}
.bA{background:var(--A)}.bB{background:var(--B)}.bC{background:var(--C)}.bX{background:var(--blue)}
.star{position:absolute;right:8px;top:6px;font-size:20px}
.msg{padding:9px 12px;border-radius:9px;margin:6px 0;font-size:13px}
.msg.err{background:#fee4e2;color:#7a271a}.msg.warn{background:#fef0c7;color:#7a4b00}.msg.ok{background:#d1fadf;color:#05603a}.msg.info{background:var(--g4)}
/* form */
.form h2.sec{background:var(--g1);color:#fff;padding:7px 12px;border-radius:8px;margin:18px 0 8px;font-size:14px;letter-spacing:.4px}
.form .info{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px 18px}
.form .info div{display:flex;gap:8px;border-bottom:1px dashed var(--line);padding:3px 0}.form .info span{color:var(--mute);min-width:130px}
.obj td{padding:5px}.obj input{padding:5px 6px}
.obj .crit input{min-width:74px;font-size:12px}
.obj .num{width:78px}
.comp{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.comp>.hd{display:flex;gap:12px;align-items:flex-start;padding:10px;background:var(--g4)}
.comp .t{flex:1;white-space:pre-line;font-size:13px}
.comp .t b{font-size:13px}
.comp details{padding:0 10px 8px}.comp summary{cursor:pointer;color:var(--g2);padding:6px 0;font-size:12px}
.comp .ind{display:grid;grid-template-columns:1fr 1fr;gap:12px;white-space:pre-line;font-size:12px;color:var(--mute)}
.comp select{width:190px}
.mini{display:grid;grid-template-columns:90px repeat(3,70px);gap:4px;font-size:11px;text-align:center}
.mini div{padding:8px 2px;border-radius:6px}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal>div{background:var(--card);border-radius:14px;padding:20px;max-width:640px;width:100%;max-height:92vh;overflow:auto}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:9px 16px;border-radius:9px;z-index:99;box-shadow:0 4px 16px #0005}
.bars{display:flex;align-items:flex-end;gap:8px;height:190px;padding:6px 0 0}
.bars .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px}
.bars .p{display:flex;gap:3px;align-items:flex-end;height:150px;width:100%;justify-content:center}
.bars .p i{display:block;width:42%;border-radius:4px 4px 0 0;min-height:2px}
.bars .i1{background:#cbd5d0}.bars .i2{background:var(--g2)}
code,pre{background:var(--g4);border-radius:6px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
pre{padding:10px;overflow:auto;white-space:pre-wrap}code{padding:1px 5px}
.hide-print{}
.pr-only{display:none}
@media print{
  body{background:#fff}.top,.hide-print,.toast{display:none!important}
  main{max-width:none;margin:0;padding:0}.card{border:0;padding:0}.pr-only{display:block}
  .form h2.sec{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .comp .ind,.comp details{display:none}
  textarea{border:0;resize:none}
}
@media (max-width:700px){.comp .ind{grid-template-columns:1fr}.comp>.hd{flex-direction:column}}
</style>
</head>

"competencies":[{"title":"TEAMWORK\n\nAbility to understand “WE” versus “I” mindset, and work together to ensure that everyone wins.","developed":"• Sets and communicates clear team objectives. Keeps the team motivated to achieve the Team objectives.\n• Involves team members in defining ways to achieve desired results and defining expectations about how team members will work together.\n• Effectively manages and guides team efforts.\n• Acts in a way that is respectful of other people who are not seniors.","needs":"• Fails to lead or inspire team members to achieve team objectives and outcomes.\n• Fails to boost the morale of the team.\n• Fails to implement the right solutions recommended by the team.\n• Lacks provision of a platform for sharing knowledge and experience.\n• Fails to recognize the accomplishments of own team and cross-functional teams."},{"title":"COACHING & DEVELOPMENT\n\nAbility to develop self and others in the creation of a diverse & high-performing culture","developed":"• Leverages performance, development, and key behaviors to build people capabilities.\n• Helps team members to identify and understand their own blind spots that prevent them from working more effectively.\n• Coaches others (listens, questions, challenges) to let them explore the solutions independently.\n• Aligns development expectations and actively supports personal & professional development.\n• Builds diverse teams for long-term sustainability.","needs":"• Does not adequately recognize desired behaviors.\n• Tends to provide solutions or answers rather than giving the opportunity for learning.\n• Avoids the conversations required to align career and development opportunities of self & team.\n• Lacks active listening which affects the team’s motivation and performance.\n• Discourages the team for learning & development opportunities."},{"title":"OWNERSIP\n\n\nAbility to take responsibility for one’s work, decisions, and actions","developed":"• Promotes a culture, where people can be their authentic selves to take ownership of what they do.\n• Takes ownership of the team’s actions instead of blaming team members.\n• Adapts effectively to different situations even under stress or pressure to achieve the Company’s Objectives.\n• Addresses difficult issues in a timely manner where possible without putting the onus on someone.\n• Is clear in his thoughts and proposes solutions to problems effectively.","needs":"• Lacks the ability to track progress and intervene when necessary.\n• Fails to own a well-developed point of view to achieve the Company’s Objectives.\n• Dismisses alternative ideas and discourages colleagues from suggesting new ways of doing things.\n• Fails to take ownership of personal or team performance.\n• Fails to effectively communicate the Company’s strategy to others"},{"title":"HUMILITY\n\nAbility to be humble in a demonstrable way and lead with an example of always doing the right thing","developed":"• Recognizes quality contributions of all team members & cross-functional team members\n• Listens actively to the team’s point of view instead of using authority.\n• Gives direct actionable feedback about performance and behaviour by treating others professionally\n• Keeps confidentiality intact of other’s personal issues and doesn’t share publicly.\n• Takes the criticism of someone positively, keeping the authority aside","needs":"• Fails to act as a team member because of the authorities.\n• Finds shortcuts when under pressure instead of following the defined protocols.\n• Presents him/herself in a way that is inconsistent with the vision of the Company.\n• Makes false promises to avoid transparent discussion.\n• Puts him/herself before the Company"},{"title":"INTEGRITY\n\nAbility to commit ethical conduct and moral principles in all activities","developed":"• Leads by example and set clear expectations for ethical behaviour in their teams.\n• Provides honest, constructive, and timely feedback to one’s team members.\n• Makes fair and objective decisions based on evidence and best practices.\n• Communicates openly and effectively with all stakeholders about the Objectives, progress, and challenges of their work.\n• Recognizes team members who demonstrate integrity and address those who do not.","needs":"• Fails to follow through on one’s commitments or promises or lets others off the hook for theirs.\n• Rationalizes own mistakes or failures and discourages others from addressing theirs.\n• Lacks in addressing ethical violations within their teams.\n• Exhibits insensitive behaviour in identifying and addressing conflicts of interest.\n• Lacks in developing the biasness free work environment."},{"title":"INNOVATION\n\nThe ability to generate novel ideas, solutions, approaches, and to think outside the box to add value to tasks,\nprojects, and the organization as a whole.","developed":"• Provides the freedom to experiment and encourages to learn from failures.\n• Empower team members to share novel ideas.\n• Invest in training to enhance innovation skills.\n• Provide constructive feedback and coaching to staff on their innovative initiatives.\n• Tracks and measures the outcomes and benefits of innovation initiatives against predefined criteria.","needs":"• Restricts staff from exploring and experimenting with new ideas.\n• Overlooks staff efforts and achievements in innovative initiatives.\n• Fails to monitor or report on the progress and impact of innovation initiatives.\n• Overlooks opportunities for diverse perspectives to inculcate creativity.\n• Discourages unconventional approaches to problem-solving"}]}</script>

<script>/* ===== PMS ENGINE: exact port of the Excel formulas =====
   All calculations use integer (hundredths) math so that floating-point
   error can never push a boundary value such as 98.0 into the wrong rating. */
const PMS = (() => {
  const LEVELS = { A: 'A - Exceed Expectation', B: 'B - Meet Expectation', C: 'C - Below Expectation' };
  const DEV = 'Developed Behaviour', NEED = 'Need Improvement';
  const BOX = {
    AA: 'Exceptional Performer', AB: 'High Performer', AC: 'Potential Resource',
    BA: 'High Performer', BB: 'Good Performer', BC: 'Contributor',
    CA: 'Concern', CB: 'Low Performer', CC: 'Low Performer'
  };
  // Ideal curve (Dashboard sheet image): % of workforce per box
  const IDEAL = { CC: 5, CB: 5, CA: 5, BC: 10, BB: 50, AC: 10, BA: 5, AB: 5, AA: 5 };
  const POLICY = { minObj: 4, maxObj: 7, maxWeight: 30, totalWeight: 100 };

  const H = x => Math.round(Number(x) * 100);          // -> hundredths (integer)
  const isNum = x => x !== '' && x !== null && x !== undefined && !isNaN(Number(x));

  // Objective level: Excel L15:L21
  function objLevel(pct) {
    if (!isNum(pct)) return null;
    const h = H(pct);
    if (h >= 9800) return 'A';
    if (h >= 8000) return 'B';
    if (h >= 1) return 'C';          // Excel: K>=0.01%
    return null;                     // 0 => "Add Achievement %"
  }

  // IPI: Excel N14 + L22. (Fix: Excel returned FALSE between 79.9 and 80)
  function ipi(objs) {
    let S = 0, W = 0;
    (objs || []).forEach(o => { const w = isNum(o.weight) ? H(o.weight) : 0; const p = isNum(o.pct) ? H(o.pct) : 0; S += w * p; W += w; });
    return { points: S / 1e6, weight: W / 100, level: S >= 98e6 ? 'A' : S >= 80e6 ? 'B' : 'C' };
  }

  // BPI: Excel Q26:Q31, Q25, L32. 6 competencies x 16.67% ; A>=100%, B>=66.68%
  function bpi(ratings) {
    const r = ratings || [];
    const dev = r.filter(x => x === DEV).length;
    const answered = r.filter(x => x === DEV || x === NEED).length;
    const scoreH = dev * 1667;                                   // hundredths of percent
    return { developed: dev, answered, score: scoreH / 100, level: scoreH >= 10000 ? 'A' : scoreH >= 6668 ? 'B' : 'C' };
  }

  function final(a) {
    const i = ipi(a.objectives), b = bpi(a.bpi);
    const code = i.level + b.level;
    return { ipi: i, bpi: b, code, label: BOX[code] };
  }

  // Policy validation (Guidelines page): 4-7 objectives, total 100, max 30% each
  function validate(a) {
    const errors = [], warnings = [];
    const o = a.objectives || [];
    if (o.length < POLICY.minObj) errors.push(`At least ${POLICY.minObj} SMART objectives are required (currently ${o.length}).`);
    if (o.length > POLICY.maxObj) errors.push(`A maximum of ${POLICY.maxObj} objectives is allowed (currently ${o.length}).`);
    const W = o.reduce((s, x) => s + (isNum(x.weight) ? H(x.weight) : 0), 0);
    if (W !== POLICY.totalWeight * 100) errors.push(`Total weightage must be 100% (currently ${W / 100}%).`);
    o.forEach((x, i) => {
      if (!String(x.text || '').trim()) errors.push(`Objective ${i + 1}: title is empty.`);
      if (isNum(x.weight) && Number(x.weight) > POLICY.maxWeight) errors.push(`Objective ${i + 1}: weightage is ${x.weight}%, the maximum allowed is ${POLICY.maxWeight}%.`);
      if (!isNum(x.weight) || Number(x.weight) <= 0) errors.push(`Objective ${i + 1}: enter a weightage.`);
      if (!isNum(x.pct)) errors.push(`Objective ${i + 1}: enter the Achievement %.`);
      else if (Number(x.pct) < 0 || Number(x.pct) > 150) errors.push(`Objective ${i + 1}: Achievement % must be between 0 and 150.`);
      else if (Number(x.pct) === 0) warnings.push(`Objective ${i + 1}: Achievement is 0%.`);
    });
    const b = bpi(a.bpi);
    if (b.answered < 6) errors.push(`Rate all 6 BPI competencies (${b.answered}/6 done).`);
    return { errors, warnings, ok: errors.length === 0 };
  }

  function distribution(list) {
    const d = {}; Object.keys(IDEAL).forEach(k => d[k] = 0);
    list.forEach(a => { d[final(a).code]++; });
    return d;
  }

  return { LEVELS, DEV, NEED, BOX, IDEAL, POLICY, H, isNum, objLevel, ipi, bpi, final, validate, distribution };
})();
if (typeof module !== 'undefined') module.exports = PMS;
</script>
<script>(function () {
'use strict';
const SEED = JSON.parse(document.getElementById('seed').textContent);
const EXPECTED = JSON.parse(document.getElementById('expected').textContent);
const COMP = SEED.competencies;
const KEY = 'pms2025.v1';
const STATUS = {
  draft: ['Draft', 's-draft'], lm_submitted: ['Pending HOD approval', 's-lm'],
  hod_approved: ['HOD approved · pending HR', 's-hod'], hr_final: ['Finalized by HR', 's-final']
};
const ROLES = { admin: 'Admin', hr: 'HR', lm: 'Line Manager', hod: 'Head of Department' };
const ORDER = ['CC', 'CB', 'CA', 'BC', 'BB', 'AC', 'BA', 'AB', 'AA'];
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const now = () => new Date().toISOString();
const fmtDate = d => d ? new Date(d).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '';
const fmtTime = d => d ? new Date(d).toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
const clone = o => JSON.parse(JSON.stringify(o));

/* ================= STATE ================= */
function seedState() {
  const as = {};
  Object.entries(SEED.assessments).forEach(([id, a]) => {
    as[id] = { ...clone(a), empComment: '', status: 'draft', sign: {}, _rev: 1,
      log: [{ t: now(), by: 'System', a: 'Imported from Excel (PMS 2025 - Filmline IPAK)' }] };
  });
  return { employees: SEED.employees.map(e => ({ ...e, _rev: 1 })), assessments: as,
    session: { role: 'admin', person: '' }, cloud: { apiKey: '', projectId: '' }, auth: null,
    ut: {}, dirty: {}, conflicts: {}, lastSync: null };
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
if (!S || !S.employees) S = seedState();
function persist() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* storage full/blocked */ } }
let toastT;
function toast(m) {
  let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = m; clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 3200);
}
const empById = id => S.employees.find(e => String(e.id) === String(id));
const people = k => [...new Set(S.employees.map(e => e[k]).filter(Boolean))].sort();

/* ================= PERMISSIONS ================= */
function can(action, e, a) {
  const r = S.session.role, p = S.session.person;
  const admin = r === 'admin', hr = r === 'hr', isLM = r === 'lm' && e.lineManager === p, isHOD = r === 'hod' && e.hod === p;
  switch (action) {
    case 'edit': return a.status === 'draft' && (admin || hr || isLM);
    case 'hod': return a.status === 'lm_submitted' && (admin || isHOD);
    case 'hr': return a.status === 'hod_approved' && (admin || hr);
    case 'empComment': return (a.status === 'hod_approved' || a.status === 'hr_final') && (admin || hr);
    case 'reopen': return a.status !== 'draft' && (admin || hr);
    case 'manage': return admin || hr;
    case 'view': return admin || hr || isLM || isHOD;
  }
  return false;
}

/* ================= CLOUD (Firebase Auth + Firestore REST) ================= */
const Cloud = {
  get on() { return !!(S.cloud.apiKey && S.cloud.projectId); },
  get signedIn() { return this.on && !!S.auth; },
  base() { return `https://firestore.googleapis.com/v1/projects/${encodeURIComponent(S.cloud.projectId)}/databases/(default)/documents`; },
  async login(email, pw) {
    const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${encodeURIComponent(S.cloud.apiKey)}`,
      { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password: pw, returnSecureToken: true }) });
    const j = await r.json();
    if (!r.ok) throw new Error(({ INVALID_LOGIN_CREDENTIALS: 'Wrong email or password', EMAIL_NOT_FOUND: 'Email not found', INVALID_PASSWORD: 'Wrong password', API_KEY_INVALID: 'API key is invalid' }[j.error?.message]) || j.error?.message || 'Login failed');
    S.auth = { email: String(j.email).toLowerCase(), idToken: j.idToken, refreshToken: j.refreshToken, exp: Date.now() + Number(j.expiresIn) * 1000 };
    try { await this.loadRole(); } catch (e) { S.auth = null; persist(); throw e; }
    persist();
  },
  async token() {
    if (!S.auth) throw new Error('Not signed in');
    if (Date.now() > S.auth.exp - 60000) {
      const r = await fetch(`https://securetoken.googleapis.com/v1/token?key=${encodeURIComponent(S.cloud.apiKey)}`,
        { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: `grant_type=refresh_token&refresh_token=${encodeURIComponent(S.auth.refreshToken)}` });
      const j = await r.json();
      if (!r.ok) { S.auth = null; persist(); throw new Error('Session expired, please sign in again'); }
      S.auth.idToken = j.id_token; S.auth.refreshToken = j.refresh_token; S.auth.exp = Date.now() + Number(j.expires_in) * 1000; persist();
    }
    return S.auth.idToken;
  },
  async api(method, path, body, qs) {
    const tok = await this.token();
    const r = await fetch(`${this.base()}/${path}${qs || ''}`, { method, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tok }, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(j.error?.message || ('HTTP ' + r.status)); e.status = r.status; throw e; }
    return j;
  },
  async loadRole() {
    let d;
    try { d = await this.api('GET', 'users/' + encodeURIComponent(S.auth.email)); }
    catch (e) { throw new Error(e.status === 404 ? 'No role assigned to this email. Ask your Admin to add you in the "users" collection.' : (e.status === 403 ? 'Access denied by database rules.' : e.message)); }
    const role = d.fields?.role?.stringValue, person = d.fields?.person?.stringValue || '';
    if (!ROLES[role]) throw new Error('Invalid role on your user record.');
    S.session = { role, person };
  },
  async listAll(col) {
    let out = [], tok = '';
    do { const j = await this.api('GET', col, null, `?pageSize=300${tok ? '&pageToken=' + encodeURIComponent(tok) : ''}`); out = out.concat(j.documents || []); tok = j.nextPageToken || ''; } while (tok);
    return out;
  },
  async put(col, id, obj, force) {
    const key = col + ':' + id;
    const body = { fields: { json: { stringValue: JSON.stringify(obj) }, rev: { integerValue: String((obj._rev || 0) + 1) }, updatedBy: { stringValue: S.auth.email } } };
    let qs = '?updateMask.fieldPaths=json&updateMask.fieldPaths=rev&updateMask.fieldPaths=updatedBy';
    if (!force) qs += S.ut[key] ? `&currentDocument.updateTime=${encodeURIComponent(S.ut[key])}` : '&currentDocument.exists=false';
    const j = await this.api('PATCH', `${col}/${encodeURIComponent(id)}`, body, qs);
    obj._rev = (obj._rev || 0) + 1; S.ut[key] = j.updateTime;
  }
};

let syncing = false, syncState = 'local', pushT, lastErr = '';
function mark(key) { S.dirty[key] = 1; persist(); schedulePush(); updateChip(); }
function schedulePush() { if (!Cloud.signedIn) return; clearTimeout(pushT); pushT = setTimeout(() => sync(false), 1200); }
async function sync(pull = true) {
  if (!Cloud.signedIn || syncing) return;
  syncing = true; syncState = 'sync'; updateChip();
  try {
    for (const key of Object.keys(S.dirty)) {
      const [k, id] = key.split(':'); const col = k === 'as' ? 'assessments' : 'employees';
      const obj = k === 'as' ? S.assessments[id] : empById(id);
      if (!obj) { delete S.dirty[key]; continue; }
      try { await Cloud.put(col, id, obj, false); delete S.dirty[key]; delete S.conflicts[key]; }
      catch (e) { if (e.status === 409 || e.status === 400 && /precondition|exist/i.test(e.message) || e.status === 412) S.conflicts[key] = 1; else throw e; }
    }
    if (pull) {
      for (const [col, k] of [['employees', 'emp'], ['assessments', 'as']]) {
        const docs = await Cloud.listAll(col);
        docs.forEach(d => {
          const id = decodeURIComponent(d.name.split('/').pop()), key = k + ':' + id;
          let obj; try { obj = JSON.parse(d.fields.json.stringValue); } catch (e) { return; }
          obj._rev = Number(d.fields.rev?.integerValue || 0);
          if (S.dirty[key]) { if (S.ut[key] !== d.updateTime) S.conflicts[key] = 1; return; }
          if (S.ut[key] === d.updateTime) return;
          S.ut[key] = d.updateTime;
          if (k === 'as') S.assessments[id] = obj;
          else { const i = S.employees.findIndex(x => String(x.id) === id); if (i >= 0) S.employees[i] = obj; else S.employees.push(obj); }
        });
      }
      S.lastSync = now();
    }
    syncState = Object.keys(S.conflicts).length ? 'conflict' : 'ok'; lastErr = '';
  } catch (e) {
    lastErr = e.message; syncState = e.status === 403 ? 'denied' : 'offline';
    if (/Session expired|Not signed/.test(e.message)) { syncState = 'out'; }
  }
  syncing = false; persist(); updateChip(); if (!isEditingInput()) renderKeep();
}
const isEditingInput = () => /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');
setInterval(() => { if (Cloud.signedIn && !document.hidden) sync(true); }, 45000);
window.addEventListener('online', () => sync(true));

function updateChip() {
  const el = $('#syncChip'); if (!el) return;
  const n = Object.keys(S.dirty).length;
  const m = {
    local: ['warn', 'Local mode · this browser only'], sync: ['warn', 'Syncing…'],
    ok: ['ok', 'Cloud synced' + (S.lastSync ? ' · ' + fmtTime(S.lastSync) : '')],
    offline: ['err', `Offline · ${n} unsaved`], denied: ['err', 'Cloud: permission denied'],
    conflict: ['err', 'Conflict · action needed'], out: ['err', 'Signed out']
  };
  const [c, t] = m[Cloud.on ? (Cloud.signedIn ? syncState : 'out') : 'local'];
  el.innerHTML = `<span class="dot ${c}"></span>${esc(t)}${n && syncState !== 'offline' && Cloud.signedIn ? ' · ' + n + ' pending' : ''}`;
  el.title = lastErr;
}

/* ================= HELPERS ================= */
const lvlPill = l => l ? `<span class="pill l${l}">${l}</span>` : '<span class="pill l0">–</span>';
const lvlFull = l => l ? `<span class="pill l${l}">${PMS.LEVELS[l]}</span>` : '<span class="pill l0">Add Achievement %</span>';
const statusPill = s => `<span class="pill ${STATUS[s][1]}">${STATUS[s][0]}</span>`;
const summary = (e) => { const a = S.assessments[e.id]; return a ? PMS.final(a) : null; };
function audit(a, text) { (a.log = a.log || []).push({ t: now(), by: Cloud.signedIn ? S.auth.email : (ROLES[S.session.role] + (S.session.person ? ' – ' + S.session.person : '')), a: text }); }
function visibleEmps() { return S.employees.filter(e => { const a = S.assessments[e.id]; return a && can('view', e, a); }); }
function blankAssessment() {
  return { objectives: [1, 2, 3, 4].map(() => ({ text: '', a: '', b: '', c: '', weight: 25, achievement: '', pct: '' })), bpi: Array(6).fill(''),
    lmComment: '', hodComment: '', empComment: '', status: 'draft', sign: {}, _rev: 0, log: [{ t: now(), by: 'System', a: 'Form created' }] };
}

/* ================= ROUTER / SHELL ================= */
let route = { name: 'dashboard', arg: '', q: {} };
function parseHash() {
  const h = location.hash.replace(/^#\/?/, ''); const [path, qs] = h.split('?'); const [name, arg] = (path || 'dashboard').split('/');
  const q = {}; new URLSearchParams(qs || '').forEach((v, k) => q[k] = v);
  route = { name: name || 'dashboard', arg: arg || '', q };
}
function go(h) { location.hash = h; }
window.addEventListener('hashchange', () => { parseHash(); render(); window.scrollTo(0, 0); });
function renderKeep() { const y = window.scrollY; render(); window.scrollTo(0, y); }

function shell(body) {
  const nav = [['dashboard', 'Dashboard'], ['employees', 'Employees'], ['guidelines', 'Guidelines'], ['settings', 'Settings'], ['tests', 'Tests & Audit']];
  const on = route.name === 'emp' ? 'employees' : route.name;
  const who = Cloud.signedIn ? `${esc(S.auth.email)} · ${ROLES[S.session.role]}` : `${ROLES[S.session.role]}${S.session.person ? ' · ' + esc(S.session.person) : ''}`;
  return `<header class="top"><div class="top-in">
    <div class="brand">IPAK PMS 2025<small>Performance Assessment · Filmline</small></div>
    <nav>${nav.map(([k, l]) => `<a href="#/${k}" class="${on === k ? 'on' : ''}">${l}</a>`).join('')}</nav>
    <span class="chip" id="syncChip"></span><span class="chip">${who}</span>
    ${Cloud.signedIn ? '<button class="btn sm" id="btnSync">Sync</button><button class="btn sm" id="btnOut">Sign out</button>' : ''}
  </div></header><main>${banner()}${body}</main>`;
}
function banner() {
  const c = Object.keys(S.conflicts);
  if (!c.length) return '';
  return `<div class="msg err"><b>Sync conflict:</b> someone else changed ${c.length} record(s) while you also edited them: ${c.map(esc).join(', ')}.
    <div class="row" style="margin-top:6px"><button class="btn sm" data-act="takeCloud">Use cloud version (discard my changes)</button><button class="btn sm" data-act="forceMine">Overwrite cloud with mine</button></div></div>`;
}

function render() {
  const app = $('#app');
  if (Cloud.on && !Cloud.signedIn) { app.innerHTML = loginView(); updateChip(); bindLogin(); return; }
  let body = '';
  const v = route.name;
  if (v === 'dashboard') body = dashboardView();
  else if (v === 'employees') body = employeesView();
  else if (v === 'emp') body = formView(route.arg);
  else if (v === 'guidelines') body = guidelinesView();
  else if (v === 'settings') body = settingsView();

  const rows = ['A', 'B', 'C'], cols = ['C', 'B', 'A'];

function refreshComputed(e, a) {

  $('#bpiPts').innerHTML = `${f.bpi.score.toFixed(2)}% (${f.bpi.developed}/6 developed)`; $('#bpiLvl').innerHTML = lvlFull(f.bpi.level);
  $('#finalTxt').innerHTML = `IPI <b>${f.ipi.level}</b> + BPI <b>${f.bpi.level}</b> = <b style="font-size:18px">${f.code[0]} ${f.code[1]}</b> · ${f.label}`;
  const colr = c => ({ AA: '#548235', AB: '#548235', BA: '#548235', BB: '#a9d18e', AC: '#aec6e8', BC: '#aec6e8', CA: '#aec6e8', CB: '#f8cbad', CC: '#f8cbad' }[c]);

}

/* ===== form events ===== */
function setPath(obj, path, val) { const p = path.split('.'); let o = obj; for (let i = 0; i < p.length - 1; i++) o = o[p[i]]; o[p[p.length - 1]] = val; }
let saveT;
document.addEventListener('input', ev => {
  const el = ev.target; if (!el.dataset || !el.dataset.p || route.name !== 'emp') return;
  const e = empById(route.arg), a = e && S.assessments[e.id]; if (!a) return;
  let v = el.value; if (/\.(weight|pct)$/.test(el.dataset.p)) v = v === '' ? '' : Number(v);
  setPath(a, el.dataset.p, v); refreshComputed(e, a);
  clearTimeout(saveT); saveT = setTimeout(() => mark('as:' + e.id), 700);
});
document.addEventListener('change', ev => { if (ev.target.dataset?.p && route.name === 'emp') { clearTimeout(saveT); const e = empById(route.arg); if (e) mark('as:' + e.id); } });

function transition(e, a, to, text, signKey) {
  const v = PMS.validate(a);
  if (to === 'lm_submitted' && !v.ok) { alert('Cannot submit yet:\n\n• ' + v.errors.join('\n• ')); return; }
  a.status = to; a.sign = a.sign || {};
  if (signKey) a.sign[signKey] = { by: Cloud.signedIn ? S.auth.email : (S.session.person || ROLES[S.session.role]), at: now() };
  audit(a, text); mark('as:' + e.id); renderKeep();
}

/* ================= GLOBAL CLICK HANDLER ================= */
document.addEventListener('click', async ev => {
  const t = ev.target.closest('[data-act],[data-box],tr.click,#btnSync,#btnOut,#btnAddEmp,#btnXls'); if (!t) return;
  if (t.dataset.box) { go('#/employees?box=' + t.dataset.box); return; }
  if (t.matches('tr.click')) { go('#/emp/' + t.dataset.id); return; }
  if (t.id === 'btnSync') { await sync(true); toast(syncState === 'ok' ? 'Synced' : 'Sync problem: ' + lastErr); return; }
  if (t.id === 'btnOut') { if (Object.keys(S.dirty).length && !confirm('You have unsynced changes. Sign out anyway?')) return; S.auth = null; persist(); render(); return; }
  if (t.id === 'btnAddEmp') { empModal(); return; }
  if (t.id === 'btnXls') { exportExcel(); return; }
  const act = t.dataset.act;
  if (act === 'takeCloud') { Object.keys(S.conflicts).forEach(k => { delete S.dirty[k]; delete S.ut[k]; }); S.conflicts = {}; await sync(true); toast('Cloud version loaded'); return; }
  if (act === 'forceMine') { for (const k of Object.keys(S.conflicts)) { const [kk, id] = k.split(':'); try { await Cloud.put(kk === 'as' ? 'assessments' : 'employees', id, kk === 'as' ? S.assessments[id] : empById(id), true); delete S.dirty[k]; delete S.conflicts[k]; } catch (e) { toast(e.message); } } persist(); renderKeep(); return; }
  if (route.name !== 'emp') return;
  const e = empById(route.arg), a = e && S.assessments[e.id]; if (!a) return;
  switch (act) {
    case 'print': window.print(); break;
    case 'addObj': if (a.objectives.length >= PMS.POLICY.maxObj) { alert('Maximum ' + PMS.POLICY.maxObj + ' objectives allowed.'); break; } a.objectives.push({ text: '', a: '', b: '', c: '', weight: 0, achievement: '', pct: '' }); mark('as:' + e.id); renderKeep(); break;
    case 'delObj': if (a.objectives.length <= PMS.POLICY.minObj && !confirm('Policy requires at least ' + PMS.POLICY.minObj + ' objectives. Remove anyway?')) break; a.objectives.splice(Number(t.dataset.i), 1); mark('as:' + e.id); renderKeep(); break;
    case 'submit': transition(e, a, 'lm_submitted', 'Submitted to HOD by Line Manager', 'lm'); break;
    case 'approve': if (confirm('Approve this assessment?')) transition(e, a, 'hod_approved', 'Approved by HOD', 'hod'); break;
    case 'return': { const r = prompt('Reason for returning to Line Manager:'); if (r === null) break; a.sign = {}; transition(e, a, 'draft', 'Returned to Line Manager by HOD: ' + (r || '(no reason given)')); break; }
    case 'finalize': if (confirm('Finalize and lock this assessment?')) transition(e, a, 'hr_final', 'Finalized by HR'); break;
    case 'reopen': { const r = prompt('Reason for re-opening:'); if (r === null) break; a.sign = {}; transition(e, a, 'draft', 'Re-opened: ' + (r || '(no reason given)')); break; }
    case 'empSign': a.sign = a.sign || {}; a.sign.emp = { by: S.session.person || ROLES[S.session.role], at: now() }; audit(a, 'Employee acknowledgement recorded by HR'); mark('as:' + e.id); renderKeep(); break;
  }
});

  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div><h2>Add employee</h2><div class="grid g2" style="gap:8px">${f.map(([k, l, t]) => `<div><label class="f">${l}</label><input id="em_${k}" type="${t || 'text'}" ${t === 'number' ? 'step="any"' : ''}></div>`).join('')}</div><div id="emMsg"></div>
  <div class="row" style="margin-top:12px"><span class="sp"></span><button class="btn" id="emX">Cancel</button><button class="btn p" id="emOk">Add</button></div></div>`;
  document.body.appendChild(m);
  $('#emX').onclick = () => m.remove();
  $('#emOk').onclick = () => {
    const e = {}; f.forEach(([k]) => e[k] = $('#em_' + k).value.trim());
    if (!e.id || !e.name || !e.lineManager || !e.hod) { $('#emMsg').innerHTML = '<div class="msg err">ID, name, supervisor and HOD are required.</div>'; return; }
    if (empById(e.id)) { $('#emMsg').innerHTML = '<div class="msg err">This Employee ID already exists.</div>'; return; }
    e.id = Number(e.id); e.perf2024 = e.perf2024 === '' ? null : Number(e.perf2024); e._rev = 0;
    S.employees.push(e); S.assessments[e.id] = blankAssessment(); mark('emp:' + e.id); mark('as:' + e.id); m.remove(); go('#/emp/' + e.id); toast('Employee added');
  };
}

/* ================= EXPORT / IMPORT ================= */
function exportRows() {
  return S.employees.map((e, i) => { const a = S.assessments[e.id], f = PMS.final(a);
    return { 'Sr. #': i + 1, 'Emp ID': e.id, 'Full Name': e.name, Designation: e.designation, Location: e.location, Geo: e.geo, Department: e.department, Section: e.section, Grade: e.grade, 'Date of Joining': e.doj, 'Direct Supervisor': e.lineManager, HOD: e.hod,
      '2024 - Performance': e.perf2024 ?? 'N/A', 'IPI - 2025 (points)': f.ipi.points, 'IPI Rating': PMS.LEVELS[f.ipi.level], 'Short IPI': f.ipi.level, 'BPI - 2025 (%)': f.bpi.score, 'BPI Rating': PMS.LEVELS[f.bpi.level], 'Short BPI': f.bpi.level, 'Final Performance': f.code[0] + ' ' + f.code[1], '9-Box Label': f.label, Status: STATUS[a.status][0] }; });
}
function loadXlsx() { return new Promise((res, rej) => { if (window.XLSX) return res(); const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
function download(name, text, type) { const b = new Blob([text], { type }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
async function exportExcel() {
  const rows = exportRows(), objs = [];
  S.employees.forEach(e => S.assessments[e.id].objectives.forEach((o, i) => objs.push({ 'Emp ID': e.id, Name: e.name, '#': i + 1, Objective: o.text, 'Weightage %': o.weight, Achievement: o.achievement, 'Achievement %': o.pct, Level: PMS.objLevel(o.pct) || '' })));
  try { await loadXlsx(); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'IFL Summary'); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(objs), 'Objectives'); XLSX.writeFile(wb, 'PMS_2025_Export.xlsx'); }
  catch (er) { const k = Object.keys(rows[0]); download('PMS_2025_Export.csv', [k.join(','), ...rows.map(r => k.map(c => '"' + String(r[c]).replace(/"/g, '""') + '"').join(','))].join('\n'), 'text/csv'); toast('Excel library unavailable offline – CSV downloaded instead'); }
}

/* ================= GUIDELINES ================= */
function guidelinesView() {
  return `<h1>Guidelines</h1><div class="grid g2"><div class="card"><h2>Individual Performance Indicators (IPI)</h2><ul>
  <li>Minimum <b>4</b> and maximum <b>7</b> SMART objectives per employee.</li><li>Weightages must total <b>100%</b>; no single objective above <b>30%</b>.</li>
  <li>Enter the Achievement % for each objective: <b>≥98% = A</b>, <b>≥80% = B</b>, below that = C.</li>
  <li>Overall IPI points = Σ (weightage × achievement %): <b>≥98 = A</b>, <b>≥80 = B</b>, below 80 = C.</li></ul>
  <h2>Behavioural Performance Indicators (BPI)</h2><ul><li>Rate all <b>6</b> competencies: Developed Behaviour / Need Improvement.</li><li><b>6 developed = A</b>, <b>4–5 = B</b>, <b>3 or fewer = C</b>.</li></ul></div>
  <div class="card"><h2>Final rating – 9-Box model</h2><p>First letter = IPI, second letter = BPI.</p><table><tr><th>Code</th><th>Label</th><th>Ideal %</th></tr>${['AA', 'AB', 'AC', 'BA', 'BB', 'BC', 'CA', 'CB', 'CC'].map(k => `<tr><td><b>${k[0]} ${k[1]}</b></td><td>${PMS.BOX[k]}</td><td>${PMS.IDEAL[k]}%</td></tr>`).join('')}</table></div>
  <div class="card"><h2>Review &amp; submission workflow</h2><ol><li><b>Line Manager</b> fills the form and submits to HOD.</li><li><b>HOD</b> reviews, adds comments and approves (or returns it).</li><li><b>HR</b> reviews and finalizes; the form is then locked.</li><li>Signed copies are collected; HR records the employee acknowledgement.</li></ol>
  <p style="color:var(--mute)">Timeline: 24 Nov 2025 – 25 Dec 2025. Maintain confidentiality of all performance data.</p></div></div>`;
}

/* ================= SETTINGS ================= */
const RULES = `rules_version = '2';
service cloud.firestore {
  match /databases/{db}/documents {
    function signedIn() { return request.auth != null && request.auth.token.email != null; }
    function role() { return get(/databases/$(db)/documents/users/$(request.auth.token.email)).data.role; }
    match /users/{email} {
      allow read: if signedIn() && (request.auth.token.email == email || role() == 'admin');
      allow write: if signedIn() && role() == 'admin';
    }
    match /employees/{id} {
      allow read: if signedIn();
      allow write: if signedIn() && role() in ['admin','hr'];
    }
    match /assessments/{id} {
      allow read: if signedIn();
      allow write: if signedIn() && role() in ['admin','hr','lm','hod'];
    }
  }
}`;
function settingsView() {
  const cloud = `<div class="card"><h2>Cloud database (Firebase)</h2>
   <p style="color:var(--mute)">${Cloud.on ? 'Cloud is <b>enabled</b>.' : 'Right now data is saved <b>only in this browser</b> (local mode). Enter your Firebase details below to save to the cloud and share between users.'}</p>
   <div class="grid g2" style="gap:8px"><div><label class="f">Web API key</label><input id="cfK" value="${esc(S.cloud.apiKey)}" placeholder="AIza…"></div><div><label class="f">Project ID</label><input id="cfP" value="${esc(S.cloud.projectId)}" placeholder="my-pms-project"></div></div>
   <div class="row" style="margin-top:10px"><button class="btn p" id="cfSave">${Cloud.on ? 'Update' : 'Enable cloud'}</button>${Cloud.on ? '<button class="btn" id="cfOff">Disable cloud</button>' : ''}
    ${Cloud.signedIn && S.session.role === 'admin' ? '<button class="btn" id="cfUp">Upload all local data to cloud (overwrite)</button>' : ''}</div>
   <details style="margin-top:12px"><summary>Setup steps (10 minutes, one time)</summary><ol>
    <li>Create a project at <b>console.firebase.google.com</b> → add a <b>Web app</b> → copy <code>apiKey</code> and <code>projectId</code>.</li>
    <li><b>Build → Authentication</b> → enable <b>Email/Password</b> and add a user for each person.</li>
    <li><b>Build → Firestore Database</b> → create database → <b>Rules</b> tab → paste the rules below → Publish.</li>
    <li>In Firestore create collection <code>users</code>; for each person add a document whose <b>ID is their lower-case email</b> with string fields <code>role</code> (admin / hr / lm / hod) and <code>person</code> (exactly the name shown as Supervisor/HOD in the employee list, for lm/hod roles).</li>
    <li>Enter the API key and project ID here, sign in as admin and press <b>Upload all local data to cloud</b>.</li>
    <li>Authentication → Settings → <b>Authorized domains</b>: add the domain where you host this file.</li></ol>
    <pre>${esc(RULES)}</pre><button class="btn sm" id="cfCopy">Copy rules</button></details></div>`;
  const local = !Cloud.on ? `<div class="card"><h2>Local demo role</h2><p style="color:var(--mute)">In local mode you can try each role. (With cloud enabled the role comes from the user record.)</p>
   <div class="row"><select id="rl" style="max-width:220px">${Object.entries(ROLES).map(([k, v]) => `<option value="${k}" ${S.session.role === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
   <select id="rp" style="max-width:280px"><option value="">(no person)</option>${[...new Set([...people('lineManager'), ...people('hod')])].map(p => `<option ${S.session.person === p ? 'selected' : ''}>${esc(p)}</option>`).join('')}</select></div></div>` : '';
  const data = `<div class="card"><h2>Data</h2><div class="row">
   <button class="btn" id="dExp">Backup (JSON)</button><label class="btn">Restore backup<input type="file" id="dImp" accept=".json" style="display:none"></label>
   ${(S.session.role === 'admin' || S.session.role === 'hr') ? '<button class="btn" id="dFin">Mark all as Finalized</button>' : ''}
   ${S.session.role === 'admin' && !Cloud.on ? '<button class="btn d" id="dReset">Reset to Excel data</button>' : ''}</div></div>`;
  return `<h1>Settings</h1>${local}${cloud}${data}`;
}
document.addEventListener('click', async ev => {
  const id = ev.target.id; if (!id) return;
  if (id === 'cfSave') { S.cloud.apiKey = $('#cfK').value.trim(); S.cloud.projectId = $('#cfP').value.trim(); S.auth = null; persist(); render(); toast('Cloud settings saved'); }
  if (id === 'cfOff') { if (confirm('Disable cloud? Data on this browser stays.')) { S.cloud = { apiKey: '', projectId: '' }; S.auth = null; persist(); render(); } }
  if (id === 'cfCopy') { navigator.clipboard?.writeText(RULES); toast('Rules copied'); }
  if (id === 'cfUp') {
    if (!confirm('This overwrites ALL employee and assessment records in the cloud with the data in this browser. Continue?')) return;
    try { for (const e of S.employees) await Cloud.put('employees', e.id, e, true); for (const [k, a] of Object.entries(S.assessments)) await Cloud.put('assessments', k, a, true); S.dirty = {}; S.conflicts = {}; persist(); toast('Uploaded ' + S.employees.length + ' employees'); sync(true); }
    catch (e) { alert('Upload failed: ' + e.message + (e.status === 403 ? '\nCheck your Firestore rules and that your user has role "admin".' : '')); }
  }
  if (id === 'dExp') download('PMS_2025_backup.json', JSON.stringify({ employees: S.employees, assessments: S.assessments }, null, 1), 'application/json');
  if (id === 'dFin') { if (!confirm('Mark every form as Finalized?')) return; Object.entries(S.assessments).forEach(([k, a]) => { if (a.status !== 'hr_final') { a.status = 'hr_final'; audit(a, 'Bulk-finalized by ' + ROLES[S.session.role]); mark('as:' + k); } }); renderKeep(); }
  if (id === 'dReset') { if (confirm('Reset ALL local data back to the imported Excel data? Your edits will be lost.')) { const c = S.cloud; S = seedState(); S.cloud = c; persist(); render(); toast('Reset done'); } }
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'rl') { S.session.role = ev.target.value; persist(); render(); }
  if (ev.target.id === 'rp') { S.session.person = ev.target.value; persist(); render(); }
  if (ev.target.id === 'dImp') {
    const f = ev.target.files[0]; if (!f) return; const r = new FileReader();
    r.onload = () => { try { const j = JSON.parse(r.result); if (!Array.isArray(j.employees) || !j.assessments) throw new Error('bad file'); if (!confirm('Replace current data with the backup?')) return; S.employees = j.employees; S.assessments = j.assessments; S.employees.forEach(e => { mark('emp:' + e.id); mark('as:' + e.id); }); persist(); render(); toast('Backup restored'); } catch (e) { alert('Invalid backup file.'); } };
    r.readAsText(f);
  }
});

/* ================= TESTS & AUDIT ================= */
function runTests() {
  const res = [], T = (name, ok, info) => res.push({ name, ok, info });
  SEED.employees.forEach(e => {
    const a = SEED.assessments[e.id], x = EXPECTED[e.id], f = PMS.final(a);
    T(`#${e.id} ${e.name}: IPI points`, Math.abs(f.ipi.points - x.ipi) < 1e-9, `${f.ipi.points.toFixed(2)} vs Excel ${x.ipi.toFixed(2)}`);
    T(`#${e.id}: IPI rating`, PMS.LEVELS[f.ipi.level] === x.ipiRating, f.ipi.level);
    T(`#${e.id}: BPI rating`, PMS.LEVELS[f.bpi.level] === x.bpiRating, f.bpi.level);
    T(`#${e.id}: Final (IFL col R)`, f.code[0] + ' ' + f.code[1] === x.final, f.code);
    T(`#${e.id}: all ${a.objectives.length} objective levels`, a.objectives.every((o, i) => (PMS.objLevel(o.pct) ? PMS.LEVELS[PMS.objLevel(o.pct)] : null) === x.objRatings[i]), '');
  });
  const mk = (ws, ps) => ws.map((w, i) => ({ text: 'x', weight: w, pct: ps[i] }));
  T('Boundary: exactly 98.00 → A', PMS.ipi(mk([25, 25, 25, 25], [98, 98, 98, 98])).level === 'A', '');
  T('Boundary: 97.99 → B', PMS.ipi(mk([100], [97.99])).level === 'B', '');
  T('Boundary: exactly 80.00 → B', PMS.ipi(mk([100], [80])).level === 'B', '');
  T('Excel gap 79.9–80 → C (Excel returned FALSE)', PMS.ipi(mk([100], [79.95])).level === 'C', '');
  T('BPI 6 developed → A; 4 → B; 3 → C', PMS.bpi(Array(6).fill(PMS.DEV)).level === 'A' && PMS.bpi([PMS.DEV, PMS.DEV, PMS.DEV, PMS.DEV, PMS.NEED, PMS.NEED]).level === 'B' && PMS.bpi([PMS.DEV, PMS.DEV, PMS.DEV, PMS.NEED, PMS.NEED, PMS.NEED]).level === 'C', '');
  T('Policy: fewer than 4 objectives rejected', !PMS.validate({ objectives: mk([40, 30, 30], [90, 90, 90]), bpi: Array(6).fill(PMS.DEV) }).ok, '');
  T('Policy: >30% weight rejected', PMS.validate({ objectives: mk([35, 25, 20, 20], [90, 90, 90, 90]), bpi: Array(6).fill(PMS.DEV) }).errors.some(m => m.includes('30%')), '');
  T('Policy: weights must total 100', PMS.validate({ objectives: mk([25, 25, 25, 20], [90, 90, 90, 90]), bpi: Array(6).fill(PMS.DEV) }).errors.some(m => m.includes('100')), '');
  T('Policy: unrated BPI blocks submission', PMS.validate({ objectives: mk([25, 25, 25, 25], [90, 90, 90, 90]), bpi: ['', ...Array(5).fill(PMS.DEV)] }).errors.some(m => m.includes('BPI')), '');
  return res;
}
function testsView() {
  const r = runTests(), bad = r.filter(x => !x.ok).length;
  const findings = [
    ['Bug', 'Employee sheets L22 (IPI Final Rating)', 'Uses <code>N14&lt;=79.9</code> for C, so a total between 79.9 and 80 (e.g. 79.95) returns FALSE. Web app: anything below 80 = C.'],
    ['Risk', 'L22 / L15:L21 floating-point', 'Totals such as 98.00000000000001 only work by luck; a total that lands at 97.99999999999999 would silently drop A to B. Web app uses exact integer math.'],
    ['Risk', 'BPI Q26:Q31, L32', 'Six × 16.67% = 100.02% and the "B" cut-off 66.68% rely on rounding hacks. Web app counts developed behaviours (6 = A, 4–5 = B, ≤3 = C) – same results as Excel for all 18 employees.'],
    ['Gap', 'Policy rules not enforced', 'Guidelines require 4–7 objectives, total 100% and max 30% per objective. The Excel only warns when the total is above 100 (I14) and never checks the rest. Web app enforces all of them before submission.'],
    ['Gap', 'BPI unrated', 'Leaving a competency on "Select Rating" silently counts as Need Improvement. Web app requires all 6 to be rated.'],
    ['Risk', 'VLOOKUP range IFL!$B$1:$M$19', 'Fixed to 19 rows – a new employee in row 20 breaks every sheet. Web app has no fixed range.'],
    ['Risk', 'IFL AA3:AA5 GETPIVOTDATA', 'References only the combinations "B B", "B A", "A B". If any other combination appears (A A, C B …) the cell shows #REF!, and the pivot needs a manual refresh (macro). Web dashboard is live for all 9 boxes.'],
    ['Cleanup', 'Hidden sheets "All" and "Mgr"', 'Point to an external workbook on D:\\ that no longer exists (broken links). Not needed in the web version.'],
    ['Cleanup', 'Cells P36:P38 "BPI Logic"', 'Scratch calculations (=3*16.67) used by nothing.'],
    ['Security', 'Macro RefreshPivot (only macro in the file)', 'Sheet password is hard-coded in plain text inside the VBA, and if the refresh errors the sheet stays unprotected. Not needed in the web version (no pivot).'],
    ['Typos', 'Labels', '"WIEGHTAGE", "Perfromance", "OWNERSIP" – corrected in the web app.'],
    ['Info', 'Excel has no 9-box labels', 'Only the star in the 3×3 grid. Web app also shows the label from the guideline (e.g. B B = Good Performer).']
  ];
  const col = { Bug: 'l0', Risk: 'lC', Gap: 'lC', Cleanup: 'lB', Security: 'lC', Typos: 'lB', Info: 'lB' };
  return `<h1>Tests &amp; Excel audit</h1>
  <div class="card"><h2>Formula parity test <span class="pill ${bad ? 'lC' : 'lA'}">${bad ? bad + ' failed' : 'all ' + r.length + ' passed'}</span></h2>
   <p style="color:var(--mute)">The web calculations are checked live against the results stored in your Excel file for all ${SEED.employees.length} employees, plus boundary and policy tests.</p>
   <div class="tw" style="max-height:340px"><table><tr><th>Test</th><th>Result</th><th>Detail</th></tr>${r.map(x => `<tr><td>${esc(x.name)}</td><td>${x.ok ? '✔' : '<b style="color:var(--err)">✘ FAIL</b>'}</td><td>${esc(x.info)}</td></tr>`).join('')}</table></div></div>
  <div class="card"><h2>Findings in the Excel workbook</h2><table><tr><th>Type</th><th>Where</th><th>Issue</th></tr>${findings.map(f => `<tr><td><span class="pill ${col[f[0]]}">${f[0]}</span></td><td>${f[1]}</td><td>${f[2]}</td></tr>`).join('')}</table></div>`;
}

/* ================= BOOT ================= */
parseHash();
render();
if (Cloud.signedIn) sync(true);
window.__PMS_APP = { S: () => S, render, go, sync };
})();
</script>
